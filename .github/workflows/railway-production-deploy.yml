name: Railway production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Railway credentials
        id: auth
        shell: bash
        env:
          PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -n "$PROJECT_TOKEN" ] || [ -n "$ACCOUNT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Railway deployment credentials are not configured; deployment step will be skipped safely."
          fi

      - name: Deploy to existing Railway service
        if: steps.auth.outputs.configured == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then
            export RAILWAY_TOKEN="$PROJECT_TOKEN"
            unset RAILWAY_API_TOKEN
          else
            export RAILWAY_API_TOKEN="$ACCOUNT_TOKEN"
            unset RAILWAY_TOKEN
          fi
          npx --yes @railway/cli up --ci --yes             --project 46c9a399-4293-4e85-a4fa-1ec49d22c462             --environment 5d98a9b0-c388-4f7d-9269-d482e8c92daf             --service 36152362-c2a4-4b92-a8a7-9a49da41d539
          echo "Waiting for production health check..."
          for i in $(seq 1 30); do
            body=$(curl -fsS https://robot-ai-production-1fdb.up.railway.app/health || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check did not reach OK state."
          exit 1

      - name: Report deployment gate
        if: steps.auth.outputs.configured != 'true'
        run: |
          echo "Production deployment is intentionally gated because no Railway token is available to this workflow."
          echo "Source code and CI remain authoritative; no deployment is claimed."
