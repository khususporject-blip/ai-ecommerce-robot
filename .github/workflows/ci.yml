name: Robot AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test

  production-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact deployed production commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 36); do
            body=$(curl -fsS --max-time 10 https://robot-ai-production-1fdb.up.railway.app/health || true)
            if BODY="$body" EXPECTED_SHA="$EXPECTED_SHA" node -e 'try { const x = JSON.parse(process.env.BODY || "{}"); process.exit(x.ok === true && x.deployment?.commit === process.env.EXPECTED_SHA ? 0 : 1); } catch { process.exit(1); }'; then
              echo "Production reports the expected commit $EXPECTED_SHA and healthy status."
              echo "$body"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report healthy status for commit $EXPECTED_SHA within 6 minutes."
          exit 1
